<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>pixel battle</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; }
    #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #000; }
    .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 6, 14, 0.94); color: #f5e6c0; font-family: sans-serif; text-align: center; z-index: 10; }
    .hidden { display: none !important; }
    #start-overlay h1 { font-size: 34px; margin: 0 0 18px; color: #ffd75a; letter-spacing: 4px; }
    #start-btn { font-size: 22px; padding: 16px 40px; border: 3px solid #ffd75a; background: #3a1d12; color: #fff; border-radius: 10px; }
    #start-note { margin-top: 16px; font-size: 13px; opacity: 0.7; }
    #rotate-icon { font-size: 64px; animation: spin 1.6s ease-in-out infinite; }
    @keyframes spin { 0%,20% { transform: rotate(0deg); } 60%,100% { transform: rotate(-90deg); } }
    #loading-bar { position: fixed; left: 50%; bottom: 40px; width: 60vw; height: 10px; transform: translateX(-50%); border: 2px solid #ffd75a; z-index: 5; }
    #loading-fill { width: 0%; height: 100%; background: #ffd75a; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading-bar"><div id="loading-fill"></div></div>

  <!-- A: タップで全画面＋横向き固定 -->
  <div id="start-overlay" class="overlay">
    <h1>pixel battle</h1>
    <button id="start-btn">タップしてスタート</button>
    <div id="start-note">全画面・横向きで始まります</div>
  </div>

  <!-- B: 縦向きのときの案内 -->
  <div id="rotate-overlay" class="overlay hidden">
    <div id="rotate-icon">📱</div>
    <p style="font-size:20px;margin-top:20px;">スマホを横にしてください</p>
  </div>

  <script>
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    var startOverlay = document.getElementById("start-overlay");
    var rotateOverlay = document.getElementById("rotate-overlay");

    // PCではスタート画面を出さない
    if (!isMobile) startOverlay.classList.add("hidden");

    function isPortrait() { return window.innerHeight > window.innerWidth; }
    function updateRotateOverlay() {
      var show = isMobile && isPortrait() && startOverlay.classList.contains("hidden");
      rotateOverlay.classList.toggle("hidden", !show);
    }
    window.addEventListener("resize", updateRotateOverlay);
    window.addEventListener("orientationchange", function () { setTimeout(updateRotateOverlay, 200); });

    function enterFullscreenLandscape() {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      var p = null;
      try { if (req) p = req.call(el); } catch (e) {}
      var lock = function () {
        try {
          if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
        } catch (e) {}
      };
      if (p && p.then) p.then(lock).catch(lock); else lock();
    }

    document.getElementById("start-btn").addEventListener("click", function () {
      enterFullscreenLandscape();
      startOverlay.classList.add("hidden");
      setTimeout(updateRotateOverlay, 300);
    });

    // 全画面が解除されたら、次のタップで再度全画面＋横固定
    document.addEventListener("fullscreenchange", function () {
      if (!document.fullscreenElement && isMobile) {
        document.addEventListener("touchend", function once() {
          document.removeEventListener("touchend", once);
          enterFullscreenLandscape();
        });
      }
    });

    // ---- Unity 読み込み ----
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/WebBuild.data.unityweb",
      frameworkUrl: buildUrl + "/WebBuild.framework.js.unityweb",
      codeUrl: buildUrl + "/WebBuild.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "pixel battle",
      productVersion: "0.1.0",
      devicePixelRatio: isMobile ? Math.min(window.devicePixelRatio || 1, 2) : 0
    };

    var canvas = document.getElementById("unity-canvas");
    var script = document.createElement("script");
    script.src = buildUrl + "/WebBuild.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.getElementById("loading-fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.getElementById("loading-bar").classList.add("hidden");
      }).catch(function (message) { alert(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
